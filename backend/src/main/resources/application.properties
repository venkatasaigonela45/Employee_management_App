spring.application.name=employee-management
server.port=8080

# MySQL (Docker maps host 3307 -> container 3306)
spring.datasource.url=jdbc:mysql://localhost:3307/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=empuser
spring.datasource.password=emppass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT — access token 1h, refresh token 7d (UC-LOGIN-03 token refresh)
app.jwt.secret=employee-assessment-jwt-secret-key-change-in-production-32b+
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

